<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="국토교통부 실거래 데이터 기반 맞춤형 부동산 전략 분석 — 청약·전세·매매 비교, 단지·지역 추천">
<title>오름홈 — 내 정보 입력</title>
<link rel="icon" href="data:,">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;800&display=swap">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="container narrow">
  <div class="page-head">
    <div class="site-head">
      <div class="logo"><a href="index.html">오름<span>홈</span></a></div>
      <div class="tagline"><a href="radar.html" style="color:var(--brand);font-weight:700;text-decoration:none">🔭 투자 레이더</a> · <a href="bargains.html" style="color:var(--bad);font-weight:700;text-decoration:none">🔥 급매</a> · 실거래 데이터로 청약·전세·매매 전략을 한 번에</div>
    </div>
  </div>

  <form id="infoForm">
    <div class="card">
      <h2>1. 소득 · 자금</h2>
      <label>연소득 (세전, 만원) <span class="hint">원천징수영수증 기준</span></label>
      <input type="number" name="salaryAmount" min="0" step="100" placeholder="예: 6000" required>

      <label>가용 자금 (만원) <span class="hint">예금·주식 등 동원 가능한 돈</span></label>
      <input type="number" name="savingsAmount" min="0" step="100" placeholder="예: 15000" required>

      <label>현재 전세/월세 보증금 (만원) <span class="hint">이사 시 회수 가능 금액, 없으면 0</span></label>
      <input type="number" name="jeonseDeposit" min="0" step="100" value="0">
    </div>

    <div class="card">
      <h2>2. 가족</h2>
      <div class="row">
        <div>
          <label>혼인 상태</label>
          <select name="maritalStatus" id="maritalStatus" required>
            <option value="">선택하세요</option>
            <option value="single">미혼</option>
            <option value="married">기혼</option>
          </select>
        </div>
        <div>
          <label>자녀 수</label>
          <select name="childrenCount">
            <option value="0">없음</option>
            <option value="1">1명</option>
            <option value="2">2명</option>
            <option value="3">3명</option>
            <option value="4">4명 이상</option>
          </select>
        </div>
      </div>
    </div>

    <div class="card">
      <h2>3. 주택 보유 · 청약</h2>
      <label>현재 주택 보유 상태</label>
      <select name="currentHome" required>
        <option value="">선택하세요</option>
        <option value="none">무주택 (월세·본가 등)</option>
        <option value="jeonse">무주택 (전세 거주)</option>
        <option value="first-time">1주택 (생애 첫 주택)</option>
        <option value="owned">1주택</option>
        <option value="multi">2주택 이상</option>
      </select>

      <div class="row">
        <div>
          <label>무주택 기간 (년) <span class="hint">청약 가점용</span></label>
          <input type="number" name="homelessYears" min="0" max="30" step="1" placeholder="예: 5">
        </div>
        <div>
          <label>청약통장 가입기간 (년)</label>
          <input type="number" name="subscriptionYears" min="0" max="30" step="0.5" placeholder="예: 7">
        </div>
      </div>
      <p class="muted">모르면 비워두세요. 입력하면 청약 가점(84점 만점)을 계산해드립니다.</p>
    </div>

    <div class="card">
      <h2>4. 목표</h2>
      <div class="row">
        <div>
          <label>우선순위</label>
          <select name="priority" required>
            <option value="">선택하세요</option>
            <option value="own-home">내 집 마련이 최우선</option>
            <option value="investment">자산 증식 / 투자</option>
            <option value="upgrade">현재 집 갈아타기</option>
            <option value="flexible">유연하게 (전세·매매 비교)</option>
          </select>
        </div>
        <div>
          <label>목표 시기</label>
          <select name="timeline" required>
            <option value="">선택하세요</option>
            <option value="urgent">6개월 내</option>
            <option value="1year">1년 내</option>
            <option value="2year">2년 내</option>
            <option value="3plus">3년 이상</option>
          </select>
        </div>
      </div>

      <label>관심 주택 유형 <span class="hint">선택한 유형만 추천에 포함됩니다</span></label>
      <select name="housingTypes">
        <option value="apt" selected>아파트만</option>
        <option value="apt-offi">아파트 + 오피스텔</option>
        <option value="all">전부 (아파트·오피스텔·연립다세대)</option>
      </select>

      <label>희망 평형대 <span class="hint">선택 평형 기준으로 시세·단지를 계산합니다</span></label>
      <select name="areaBand">
        <option value="small">소형 (전용 60㎡ 이하 · ~24평)</option>
        <option value="mid84" selected>국민평형 (전용 60~85㎡ · 25~34평)</option>
        <option value="large">중대형 (전용 85~135㎡ · 34~50평)</option>
        <option value="xlarge">대형 (전용 135㎡ 초과)</option>
        <option value="any">상관없음 (전체)</option>
      </select>

      <label>목표 지역 <span class="hint">동네·역 이름도 OK — 강남, 여의도, 잠실, 판교, 홍대…</span></label>
      <input type="text" name="region" id="regionInput" list="regionList" placeholder="예: 강남 / 여의도 / 서울 마포구" required>

      <div class="row">
        <div>
          <label>내 직장 지역 <span class="hint">선택</span></label>
          <input type="text" name="workRegion1" list="regionList" placeholder="예: 여의도">
        </div>
        <div>
          <label>배우자 직장 지역 <span class="hint">선택</span></label>
          <input type="text" name="workRegion2" list="regionList" placeholder="예: 삼성역">
        </div>
      </div>
      <p class="muted">직장 지역을 입력하면 "직주근접 유지 + 투자 분리" 같은 조합 시나리오가 정교해집니다.</p>
      <datalist id="regionList"></datalist>
    </div>

    <button type="submit">전략 분석하기 →</button>
  </form>

  <div id="apiConfig"></div>
  <div class="footer">
    데이터: 국토교통부 실거래가 공개시스템 (매일 자동 갱신)<br>
    입력 정보는 분석에만 사용되며 본 분석은 참고용입니다
  </div>
</div>

<script src="api.js"></script>
<script>
apiFetch('/api/real-estate/regions')
  .then((regions) => {
    document.getElementById('regionList').innerHTML =
      regions.map((r) => `<option value="${r}">`).join('');
  })
  .catch(() => { /* 백엔드 미연결 시 자유 입력 */ });

try {
  const saved = JSON.parse(localStorage.getItem('ormhome_input') || 'null');
  if (saved) {
    for (const [k, v] of Object.entries(saved)) {
      const el = document.querySelector(`[name="${k}"]`);
      if (el && v !== undefined && v !== null) el.value = v;
    }
    if (saved.family) {
      document.getElementById('maritalStatus').value = saved.family.startsWith('married') ? 'married' : 'single';
    }
  }
} catch (e) { /* 무시 */ }

document.getElementById('infoForm').addEventListener('submit', (e) => {
  e.preventDefault();
  const fd = new FormData(e.target);
  const data = Object.fromEntries(fd);

  const children = parseInt(data.childrenCount) || 0;
  if (data.maritalStatus === 'married') {
    data.family = children === 0 ? 'married-no-child' : children === 1 ? 'married-1child' : 'married-2plus';
  } else {
    data.family = 'single';
  }

  ['salaryAmount', 'savingsAmount', 'jeonseDeposit', 'childrenCount', 'homelessYears', 'subscriptionYears'].forEach((k) => {
    data[k] = data[k] === '' || data[k] === undefined ? undefined : Number(data[k]);
  });

  try { localStorage.setItem('ormhome_input', JSON.stringify(data)); } catch (err) { /* 무시 */ }
  location.href = 'strategy.html';
});

renderApiConfig(document.getElementById('apiConfig'));
</script>
</body>
</html>
