name: Keep backend awake

# Render 무료 플랜은 15분 무요청 시 잠들어 첫 응답이 느려짐 → 10분마다 핑
on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping health endpoint
        run: curl -sS --max-time 30 https://ormhome-backend-sirl.onrender.com/health || true
