<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="전국 실거래에서 시세 대비 싸게 체결된 급매 거래를 자동 탐지">
<title>오름홈 — 급매 레이더</title>
<link rel="icon" href="data:,">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;800&display=swap">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="container">
  <div class="page-head">
    <div class="site-head">
      <div class="logo"><a href="index.html">오름<span>홈</span></a></div>
      <div class="tagline"><a href="radar.html" style="color:var(--brand);font-weight:700;text-decoration:none">🔭 지역 레이더</a> · 🔥 급매 레이더 — 시세보다 싸게 체결된 거래</div>
    </div>
  </div>

  <div class="card">
    <h2>필터</h2>
    <div class="row">
      <div>
        <label>지역 범위</label>
        <select id="scope">
          <option value="metro" selected>수도권</option>
          <option value="seoul">서울만</option>
          <option value="all">전국</option>
        </select>
      </div>
      <div>
        <label>최소 할인율</label>
        <select id="minDisc">
          <option value="7" selected>-7% 이상</option>
          <option value="10">-10% 이상</option>
          <option value="15">-15% 이상</option>
          <option value="20">-20% 이상</option>
        </select>
      </div>
    </div>
    <div class="row">
      <div>
        <label>최대 체결가 (만원) <span class="hint">비우면 전체</span></label>
        <input type="number" id="maxPrice" step="5000" placeholder="예: 60000">
      </div>
      <div>
        <label>정렬</label>
        <select id="sort">
          <option value="discount" selected>할인율 큰 순</option>
          <option value="date">최신 체결 순</option>
          <option value="priceAsc">가격 낮은 순</option>
        </select>
      </div>
    </div>
    <div class="row" style="margin-top:12px">
      <label style="display:flex;align-items:center;gap:8px;margin:0;font-weight:500">
        <input type="checkbox" id="exDirect" checked style="width:auto"> 직거래 제외 <span class="hint">(가족 간 저가 양도 가능성)</span>
      </label>
      <label style="display:flex;align-items:center;gap:8px;margin:0;font-weight:500">
        <input type="checkbox" id="exLow" style="width:auto"> 1~2층 제외
      </label>
    </div>
  </div>

  <div class="card" id="resultCard" hidden>
    <h2 id="resultTitle">탐지 결과</h2>
    <p class="muted" id="resultMeta" style="margin:-6px 0 10px"></p>
    <div class="table-wrap"><table id="bTable"></table></div>
    <p class="muted" style="margin-top:10px">
      할인율 = <b>같은 단지·같은 평형대(10㎡ 버킷)</b>의 6개월 평당 중위가 대비 ·
      급매엔 이유(세금·기한·하자)가 있을 수 있으니 반드시 현장 확인 ·
      단지명 클릭 → 네이버지도
    </p>
  </div>

  <div class="card" id="pending" hidden>
    <h2>⏳ 데이터 생성 중</h2>
    <p style="font-size:14px">급매 탐지 데이터는 다음 수집 사이클에서 생성됩니다 (매일 새벽 3시 자동). 잠시 후 다시 확인해주세요.</p>
  </div>

  <div class="footer">데이터: 국토교통부 실거래가 공개시스템 · 본 도구는 참고용이며 투자 권유가 아닙니다</div>
</div>

<script src="api.js"></script>
<script>
const SCOPES = {
  seoul: (n) => n.startsWith('서울'),
  metro: (n) => /^(서울|경기|인천)/.test(n),
  all: () => true,
};
let DATA = null;

function naverLink(b) {
  return 'https://map.naver.com/p/search/' + encodeURIComponent(`${b.region} ${b.dong} ${b.name}`);
}
const pyeong = (m2) => Math.round(m2 / 3.3058);

async function load() {
  try {
    const res = await fetch('https://raw.githubusercontent.com/shinhyuk/Home/data/bargains.json', { cache: 'no-cache' });
    if (!res.ok) throw new Error('404');
    DATA = await res.json();
    render();
  } catch (e) {
    document.getElementById('pending').hidden = false;
  }
}

function render() {
  if (!DATA) return;
  const scope = document.getElementById('scope').value;
  const minDisc = -Number(document.getElementById('minDisc').value);
  const maxPrice = Number(document.getElementById('maxPrice').value) || Infinity;
  const exDirect = document.getElementById('exDirect').checked;
  const exLow = document.getElementById('exLow').checked;
  const sortKey = document.getElementById('sort').value;

  let rows = DATA.items.filter((b) =>
    SCOPES[scope](b.region) &&
    b.discount <= minDisc &&
    b.price <= maxPrice &&
    (!exDirect || !b.direct) &&
    (!exLow || (b.floor ?? 99) > 2)
  );

  const sorters = {
    discount: (a, b) => a.discount - b.discount,
    date: (a, b) => b.date.localeCompare(a.date),
    priceAsc: (a, b) => a.price - b.price,
  };
  rows.sort(sorters[sortKey]);
  rows = rows.slice(0, 100);

  document.getElementById('resultCard').hidden = false;
  document.getElementById('pending').hidden = true;
  document.getElementById('resultTitle').textContent = `🔥 급매 체결 ${rows.length}건` + (rows.length === 100 ? ' (상위 100)' : '');
  document.getElementById('resultMeta').textContent =
    `기준: ${DATA.basis} · 생성 ${(DATA.generatedAt || '').slice(0, 10)}`;

  document.getElementById('bTable').innerHTML =
    '<tr><th>단지</th><th>전용/층</th><th>체결가</th><th>할인율</th><th>체결일</th></tr>' +
    rows.map((b) => `<tr>
      <td><a href="${naverLink(b)}" target="_blank" rel="noopener" style="color:inherit;text-decoration:none">
        <b style="border-bottom:1.5px dotted var(--brand)">${b.name}</b></a>
        ${b.direct ? '<span class="badge hard">직거래</span>' : ''}
        ${(b.floor ?? 99) <= 2 ? '<span class="badge tight">저층</span>' : ''}
        <span class="minor">${b.region} ${b.dong} · 표본 ${b.samples}건</span></td>
      <td>${b.area}㎡ (${pyeong(b.area)}평)<span class="minor">${b.floor ?? '-'}층</span></td>
      <td><b>${fmtMoney(b.price)}</b><span class="minor">평당 ${fmtMoney(b.pp)} / 중위 ${fmtMoney(b.medianPP)}</span></td>
      <td><b style="color:var(--bad);font-size:15px">${b.discount}%</b></td>
      <td>${b.date.slice(5)}</td>
    </tr>`).join('');
}

['scope', 'minDisc', 'maxPrice', 'exDirect', 'exLow', 'sort'].forEach((id) =>
  document.getElementById(id).addEventListener('change', render));
load();
</script>
</body>
</html>
