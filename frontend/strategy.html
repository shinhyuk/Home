<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>오름홈 — 전략 분석 결과</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="container">
  <div class="logo"><a href="index.html">오름홈</a></div>
  <div class="tagline">전략 분석 결과</div>

  <div id="loading">
    <div class="spinner"></div>
    <p>국토교통부 실거래 데이터를 분석 중입니다…</p>
    <p class="muted">처음 조회하는 지역은 최대 1~2분 걸릴 수 있습니다 (이후엔 즉시)</p>
  </div>

  <div id="error" hidden>
    <div class="error-box" id="errorMsg"></div>
    <a class="btn btn-ghost" href="index.html">← 입력으로 돌아가기</a>
  </div>

  <div id="result" hidden>
    <!-- 종합 전략 -->
    <div class="card strategy-main">
      <div class="label">종합 추천 전략</div>
      <h2 id="stTitle"></h2>
      <p id="stDesc"></p>
    </div>

    <!-- 트랙 비교: 청약 / 전세 / 매매 -->
    <div class="card">
      <h2>경로별 비교</h2>
      <div id="tracksBox"></div>
    </div>

    <!-- 지역 시세 -->
    <div class="card">
      <h2 id="regionTitle">지역 시세</h2>
      <div id="regionBox"></div>
      <h3 style="margin-top:16px">월별 실거래 추세 (아파트 매매)</h3>
      <div class="table-wrap"><table id="trendTable"></table></div>
      <p class="muted" id="sourceNote"></p>
    </div>

    <!-- 대출 -->
    <div class="card" id="loanCard" hidden>
      <h2>대출 시뮬레이션 <span class="hint" style="font-weight:400;font-size:12px">DSR 40% · 30년 원리금균등 · 연 3.5%</span></h2>
      <div id="loanBox"></div>
    </div>

    <!-- 자격 / 액션 / 경고 -->
    <div class="card">
      <h2>자격 · 현황</h2>
      <ul id="qualList"></ul>
    </div>
    <div class="card">
      <h2>액션 플랜</h2>
      <ul id="actionList"></ul>
    </div>
    <div class="card">
      <h2>주의사항</h2>
      <ul id="warnList" class="warn"></ul>
    </div>

    <a class="btn btn-ghost" href="index.html">← 정보 수정하고 다시 분석</a>
  </div>

  <div id="apiConfig"></div>
  <div class="footer">출처: 국토교통부 실거래가 공개시스템 · 본 분석은 참고용이며 투자 권유가 아닙니다</div>
</div>

<script src="api.js"></script>
<script>
const FEASIBLE_LABEL = {
  possible: '가능', tight: '빠듯함', hard: '어려움',
  ineligible: '자격 없음', unknown: '정보 부족',
};

function trackCard(t, extraHtml) {
  const cls = t.feasible || 'unknown';
  return `
    <div class="card track ${cls}" style="margin-bottom:12px">
      <h3>${t.name} <span class="badge ${cls}">${FEASIBLE_LABEL[cls] || cls}</span></h3>
      ${extraHtml}
      <p style="font-size:13px;margin:8px 0 0">${t.note || ''}</p>
      ${t.warning ? `<p class="warn">⚠ ${t.warning}</p>` : ''}
    </div>`;
}

function kv(label, value) {
  return `<div class="kv"><span>${label}</span><b>${value}</b></div>`;
}

async function run() {
  let input;
  try { input = JSON.parse(localStorage.getItem('ormhome_input') || 'null'); } catch (e) { input = null; }
  if (!input) {
    location.replace('index.html');
    return;
  }

  try {
    const r = await apiFetch('/api/analysis/analyze', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ ...input, saveResult: true }),
    });
    render(r);
  } catch (err) {
    document.getElementById('loading').hidden = true;
    document.getElementById('error').hidden = false;
    document.getElementById('errorMsg').textContent =
      '분석 실패: ' + err.message + ' — 백엔드 서버가 실행 중인지, 하단 ⚙ API 설정이 맞는지 확인하세요.';
  }
}

function render(r) {
  document.getElementById('loading').hidden = true;
  document.getElementById('result').hidden = false;

  // 종합 전략
  document.getElementById('stTitle').textContent = r.strategy.title;
  document.getElementById('stDesc').textContent = r.strategy.description;

  // 트랙 비교
  const t = r.tracks || {};
  let html = '';

  if (t.subscription) {
    const s = t.subscription.score || {};
    let scoreHtml = '';
    if (s.total !== null && s.total !== undefined) {
      scoreHtml = kv('청약 가점 (84점 만점)', `<span style="font-size:17px">${s.total}점</span>`)
        + kv('└ 무주택 기간', `${s.homelessPoints ?? '-'}점 / 32`)
        + kv('└ 부양가족', `${s.familyPoints ?? '-'}점 / 35`)
        + kv('└ 통장 가입기간', `${s.accountPoints ?? '-'}점 / 17`);
    } else if (t.subscription.eligible) {
      scoreHtml = kv('부양가족 가점', `${s.familyPoints ?? '-'}점 / 35`)
        + `<p class="muted">무주택 기간·통장 가입기간 입력 시 전체 가점 계산</p>`;
    }
    if (t.subscription.specialSupply && t.subscription.specialSupply.length) {
      scoreHtml += `<p style="font-size:13px;margin:8px 0 0"><b>검토 가능한 특별공급:</b> ${t.subscription.specialSupply.join(', ')}</p>`;
    }
    html += trackCard(t.subscription, scoreHtml);
  }

  if (t.jeonse && t.jeonse.feasible) {
    html += trackCard(t.jeonse,
      kv('지역 평균 전세보증금', fmtMoney(t.jeonse.avgDeposit))
      + kv('내 전세 예산 (자금+전세대출)', fmtMoney(t.jeonse.budget))
      + kv('필요 전세대출', fmtMoney(t.jeonse.loanNeeded))
      + kv('월 이자 부담 (연 3.8%)', fmtMoney(t.jeonse.monthlyInterest))
      + kv('전세가율', (t.jeonse.jeonseRatio ?? '-') + '%'));
  }

  if (t.buy && t.buy.feasible) {
    html += trackCard(t.buy,
      kv('지역 중위 매매가', fmtMoney(t.buy.medianPrice))
      + kv('내 최대 예산 (자금+대출)', fmtMoney(t.buy.budget))
      + kv('예산 충족률', t.buy.budgetRatio + '%')
      + kv('월 상환액 (필요 대출 기준)', fmtMoney(t.buy.monthlyPayment))
      + (t.buy.shortfall > 0 ? kv('부족 자금', fmtMoney(t.buy.shortfall)) : ''));
  }

  document.getElementById('tracksBox').innerHTML = html || '<p class="muted">시세 데이터 부족으로 비교 불가</p>';

  // 지역 시세
  const rd = r.regionData || {};
  document.getElementById('regionTitle').textContent = `${rd.name || ''} 시세 (최근 2개월 실거래)`;
  const trendClass = rd.trend === 'up' ? 'up' : rd.trend === 'down' ? 'down' : '';
  const trendLabel = rd.trend === 'up' ? `상승 +${rd.changeRate}%` : rd.trend === 'down' ? `하락 ${rd.changeRate}%` : rd.trend === 'stable' ? '보합' : '-';
  document.getElementById('regionBox').innerHTML =
    kv('아파트 평균 매매가', fmtMoney(rd.avgPrice))
    + kv('중위 매매가', fmtMoney(rd.medianPrice))
    + kv('평당가', fmtMoney(rd.avgPerPyeong))
    + kv('평균 전세보증금', fmtMoney(rd.jeonseAvgDeposit))
    + kv('전세가율', (rd.jeonseRatio ?? '-') + '%')
    + kv('6개월 추세', `<span class="${trendClass}">${trendLabel}</span>`)
    + kv('표본 거래량', (rd.tradeCount ?? 0) + '건');

  // 월별 추세 테이블
  const rows = (rd.monthlyTrend || []).map((m) =>
    `<tr><td>${m.month}</td><td>${m.count ?? 0}건</td><td>${fmtMoney(m.avgAmount)}</td><td>${fmtMoney(m.medianAmount)}</td><td>${fmtMoney(m.avgPerPyeong)}</td></tr>`
  ).join('');
  document.getElementById('trendTable').innerHTML =
    '<tr><th>월</th><th>거래량</th><th>평균가</th><th>중위가</th><th>평당가</th></tr>' + rows;

  document.getElementById('sourceNote').textContent =
    `신뢰도 ${r.confidence}% (거래량 기반) · 데이터: 국토교통부 실거래가 공개시스템`;

  // 대출
  if (r.loanSimulation) {
    const l = r.loanSimulation;
    document.getElementById('loanCard').hidden = false;
    document.getElementById('loanBox').innerHTML =
      kv('기준 주택가격 (지역 중위가)', fmtMoney(l.housePrice))
      + kv('보유 자금', fmtMoney(l.ownCapital))
      + kv('DSR 기준 최대 대출', fmtMoney(l.maxLoanByDSR))
      + kv('권장 대출액', fmtMoney(l.recommendedLoan))
      + kv('월 상환액', fmtMoney(l.monthlyPayment))
      + kv('총 이자 (30년)', fmtMoney(l.totalInterest))
      + (l.shortfall > 0 ? kv('대출 후에도 부족한 금액', `<span class="warn">${fmtMoney(l.shortfall)}</span>`) : '');
  }

  // 리스트
  const d = r.details || {};
  document.getElementById('qualList').innerHTML = (d.qualification || []).map((x) => `<li>${x}</li>`).join('');
  document.getElementById('actionList').innerHTML = (d.actions || []).map((x) => `<li>${x}</li>`).join('');
  document.getElementById('warnList').innerHTML = (d.warnings || []).map((x) => `<li>${x.replace(/^•\s*/, '')}</li>`).join('');
}

renderApiConfig(document.getElementById('apiConfig'));
run();
</script>
</body>
</html>
